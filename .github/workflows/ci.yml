name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 -c "from pipeline_core import generate_predictions; from daily_pipeline import run_pipeline; print('ok')"
